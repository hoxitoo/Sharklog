name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]

jobs:
  build:
    name: EAS ${{ inputs.profile }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        run: |
          cd apps/mobile
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
