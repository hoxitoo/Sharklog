name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
            bundle-path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

          - platform: macos-latest
            artifact: macos
            bundle-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

          - platform: ubuntu-22.04
            artifact: linux
            bundle-path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node deps
        run: npm ci

      - name: Build @sharklog/core
        run: cd packages/core && npm run build

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd apps/desktop
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing key configured — building with updater artifacts"
            npx tauri build
          else
            echo "No signing key — building without updater artifacts (test build)"
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SharkLog-${{ matrix.artifact }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release when triggered by a tag push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SharkLog ${{ github.ref_name }}
          draft: ${{ github.event.inputs.draft != 'false' }}
          generate_release_notes: true
          files: dist/**/*
          body: |
            ## SharkLog ${{ github.ref_name }}

            ### Установка

            | Платформа | Файл | Инструкция |
            |-----------|------|-----------|
            | Windows | `SharkLog_*_x64.msi` | Запусти MSI-инсталлятор |
            | Windows (альт.) | `SharkLog_*_x64-setup.exe` | Запусти NSIS-установщик |
            | macOS | `SharkLog_*.dmg` | Открой DMG, перетащи в Applications |
            | Linux | `sharklog_*.AppImage` | `chmod +x` → запусти |
            | Linux | `sharklog_*.deb` | `sudo dpkg -i sharklog_*.deb` |

            > **Windows SmartScreen**: при первом запуске может появиться предупреждение.
            > Нажми «Подробнее» → «Выполнить в любом случае» — это нормально для неподписанных приложений.
