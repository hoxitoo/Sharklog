name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run vitest (core)
        run: cd packages/core && npx vitest run --reporter=verbose
      - name: Run vitest (desktop)
        run: cd apps/desktop && npm test

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Mobile
        run: |
          cd apps/mobile
          npx tsc --noEmit --project tsconfig.json || true
      - name: Desktop
        run: |
          cd apps/desktop
          npx tsc --noEmit

