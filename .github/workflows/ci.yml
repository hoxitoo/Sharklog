name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run vitest (core)
        run: cd packages/core && npx vitest run --reporter=verbose
      - name: Run vitest (desktop)
        run: cd apps/desktop && npm test
      - name: Run jest (mobile)
        run: cd apps/mobile && npm test

  e2e:
    name: E2E tests (desktop)
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking while tests stabilise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: cd apps/desktop && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd apps/desktop && npm run test:e2e
        env:
          VITE_OWNER_PRO: 'true'
          CI: 'true'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Mobile
        run: |
          cd apps/mobile
          npx tsc --noEmit --project tsconfig.json || true
      - name: Desktop
        run: |
          cd apps/desktop
          npx tsc --noEmit

