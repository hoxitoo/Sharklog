<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SharkLog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #080810;
        color: #E2E2EF;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1C1C30; border-radius: 3px; }
      input, textarea, select { font-family: inherit; }
      button { cursor: pointer; font-family: inherit; appearance: none; -webkit-appearance: none; }

      @keyframes slideInRight {
        from { transform: translateX(48px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }
      @keyframes fadeInUp {
        from { transform: translateY(10px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes sharkFloat {
        0%, 100% { transform: translateY(0)   scale(1);    opacity: 1; }
        50%       { transform: translateY(-8px) scale(1.05); opacity: 0.85; }
      }
      @keyframes shimmer {
        0%   { background-position: -400px 0; }
        100% { background-position:  400px 0; }
      }

      .sl-toast   { animation: slideInRight 0.22s cubic-bezier(0.22,1,0.36,1); }
      .sl-page    { animation: fadeInUp 0.18s ease-out; }
      .sl-modal   { animation: fadeInUp 0.2s cubic-bezier(0.22,1,0.36,1); }
      .sl-overlay { animation: fadeIn 0.15s ease-out; }

      .sl-stat-card {
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .sl-stat-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(0,0,0,0.5) !important;
        border-color: rgba(91,106,240,0.35) !important;
      }
      .sl-nav-item { transition: background 0.12s, color 0.12s; }
      .sl-nav-item:hover { background: rgba(91,106,240,0.1) !important; color: #c8ccf8 !important; }
      .sl-nav-item:focus { outline: none; }
      .sl-nav-item:focus-visible { outline: 2px solid rgba(91,106,240,0.45); outline-offset: -2px; }
      .sl-nav-item:active { background: rgba(91,106,240,0.18) !important; }
      .sl-add-btn {
        transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
      }
      .sl-add-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(91,106,240,0.5);
        background: #6b7cf0 !important;
      }
      .sl-add-btn:active { transform: translateY(0); }
      .sl-strategy-opt { transition: border-color 0.12s, background 0.12s; }
      .sl-strategy-opt:hover { border-color: rgba(91,106,240,0.6) !important; background: rgba(91,106,240,0.08) !important; }

      .sl-skeleton {
        background: linear-gradient(90deg, #12121f 25%, #1e1e32 50%, #12121f 75%);
        background-size: 400px 100%;
        animation: shimmer 1.4s infinite linear;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
